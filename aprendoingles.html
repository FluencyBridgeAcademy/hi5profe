<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi5profe - Aprende inglés, impulsa tu futuro</title>
    
    <!-- Standard Favicon SVG Fallback -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <!-- Tailwind CSS & Fonts CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafbfc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* Nitidez del logo: evita el desenfoque al escalar imágenes pequeñas */
        .logo-crisp {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            filter: contrast(1.05) saturate(1.05);
            -webkit-filter: contrast(1.05) saturate(1.05);
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        /* Smooth motor pulse & float animation for CTA buttons */
        @keyframes motorPulse {
            0% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 15px 35px -5px rgba(236, 72, 153, 0.6); }
            100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.4); }
        }
        .btn-motor-pulse {
            animation: motorPulse 2.5s infinite ease-in-out;
        }

        /* Enhanced Phosphorescent Neon Breathing Glow Effect */
        @keyframes phosphorBreathe {
            0%, 100% {
                box-shadow: 0 0 15px rgba(168, 85, 247, 0.35), 0 0 30px rgba(236, 72, 153, 0.2);
                border-color: rgba(168, 85, 247, 0.5);
            }
            50% {
                box-shadow: 0 0 35px rgba(168, 85, 247, 0.9), 0 0 65px rgba(236, 72, 153, 0.7), 0 0 90px rgba(147, 51, 234, 0.5);
                border-color: rgba(236, 72, 153, 1);
            }
        }
        .phosphor-breathe {
            animation: phosphorBreathe 3s infinite ease-in-out;
            border: 3px solid rgba(168, 85, 247, 0.6);
        }

        /* Golden 3D Shiny Effect for VIP Card */
        @keyframes vipShine {
            0% { left: -150%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }
        .vip-gold-3d {
            background: linear-gradient(145deg, #fbe790 0%, #f6c84c 50%, #e1a01c 100%);
            box-shadow: 
                0 20px 25px -5px rgba(225, 160, 28, 0.4), 
                0 10px 10px -5px rgba(225, 160, 28, 0.2),
                inset 2px 2px 10px rgba(255, 255, 255, 0.9), 
                inset -4px -4px 15px rgba(180, 120, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }
        .vip-gold-3d::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 80%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: vipShine 4s infinite;
            pointer-events: none;
        }

        /* Dynamic scroll entrance/exit animation bidirectional */
        .scroll-animate {
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1;
            transform: none;
        }
        .js .scroll-animate {
            opacity: 0;
            transform: translateY(40px) scale(0.97);
        }
        .js .scroll-animate.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Z-Axis Bounce Effect para el título principal */
        @keyframes bounceZ {
            0%, 100% { transform: scale(1); text-shadow: 0 2px 5px rgba(0,0,0,0.05); }
            50% { transform: scale(1.08); text-shadow: 0 15px 25px rgba(0,0,0,0.15); }
        }
        .animate-bounce-z {
            animation: bounceZ 3s infinite ease-in-out;
            will-change: transform;
        }

        /* Floating Icon Animation para Recursos */
        @keyframes floatGentle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .animate-float-gentle {
            animation: floatGentle 3.5s ease-in-out infinite;
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            .btn-motor-pulse,
            .phosphor-breathe,
            .animate-bounce-z,
            .animate-float-gentle,
            .animate-ping {
                animation: none !important;
            }
            .scroll-animate {
                transition: none !important;
                transform: none !important;
            }
            .js .scroll-animate {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>

    <script>
        document.documentElement.classList.add('js');
        const WHATSAPP_NUMBER = '51936932398';
        let currentPlanType = 'Prueba Gratuita';
        let activeModalId = null;
        let lastFocusedTrigger = null;

        function getFocusableElements(container) {
            return Array.from(container.querySelectorAll('a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'))
                .filter(el => {
                    if (el.hasAttribute('hidden')) {
                        return false;
                    }
                    const style = window.getComputedStyle(el);
                    return style.visibility !== 'hidden' && style.display !== 'none' && el.getClientRects().length > 0;
                });
        }

        function openWhatsAppWindow(encodedMessage, successMessage, modalId) {
            const popup = window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank', 'noopener,noreferrer');
            if (popup) {
                closeModal(modalId);
                showToast(successMessage);
                return true;
            }
            showToast('No se pudo abrir WhatsApp. Habilita las ventanas emergentes e inténtalo de nuevo.');
            return false;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const animatedElements = document.querySelectorAll('.scroll-animate');
            if ('IntersectionObserver' in window) {
                const observerOptions = {
                    root: null,
                    rootMargin: '0px',
                    threshold: 0.15
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        } else {
                            entry.target.classList.remove('active');
                        }
                    });
                }, observerOptions);

                animatedElements.forEach(el => {
                    observer.observe(el);
                });
            } else {
                animatedElements.forEach(el => el.classList.add('active'));
            }

            const floatingWhatsAppButton = document.getElementById('floatingWhatsappBtn');
            if (floatingWhatsAppButton) {
                floatingWhatsAppButton.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Hola, quiero más información sobre Hi5profe')}`;
            }

            document.querySelectorAll('.modal-overlay').forEach((modal) => {
                modal.addEventListener('click', (event) => {
                    if (event.target === modal) {
                        closeModal(modal.id);
                    }
                });
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && activeModalId) {
                    closeModal(activeModalId);
                    return;
                }
                if (event.key === 'Tab' && activeModalId) {
                    const modal = document.getElementById(activeModalId);
                    const focusableElements = getFocusableElements(modal);
                    if (focusableElements.length === 0) {
                        return;
                    }
                    if (!modal.contains(document.activeElement)) {
                        event.preventDefault();
                        focusableElements[0].focus();
                        return;
                    }
                    const first = focusableElements[0];
                    const last = focusableElements[focusableElements.length - 1];
                    if (event.shiftKey && document.activeElement === first) {
                        event.preventDefault();
                        last.focus();
                    } else if (!event.shiftKey && document.activeElement === last) {
                        event.preventDefault();
                        first.focus();
                    }
                }
            });
        });

        // Mobile Menu Toggle
        function closeMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const icon = document.getElementById('menuIcon');
            const mobileMenuButton = document.getElementById('mobileMenuButton');
            if (menu) {
                menu.classList.add('hidden');
            }
            if (icon) {
                icon.className = 'fa-solid fa-bars text-xl';
            }
            if (mobileMenuButton) {
                mobileMenuButton.setAttribute('aria-expanded', 'false');
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const icon = document.getElementById('menuIcon');
            const mobileMenuButton = document.getElementById('mobileMenuButton');
            menu.classList.toggle('hidden');
            if(menu.classList.contains('hidden')) {
                icon.className = 'fa-solid fa-bars text-xl';
                if (mobileMenuButton) {
                    mobileMenuButton.setAttribute('aria-expanded', 'false');
                }
            } else {
                icon.className = 'fa-solid fa-xmark text-xl';
                if (mobileMenuButton) {
                    mobileMenuButton.setAttribute('aria-expanded', 'true');
                }
            }
        }

        // Modals Management
        function openModal(modalId, planName = 'Prueba Gratuita', triggerEl = document.activeElement) {
            closeMobileMenu();
            const requestedModal = document.getElementById(modalId);
            if (activeModalId === modalId && requestedModal && !requestedModal.classList.contains('hidden')) {
                return;
            }
            const hadActiveModal = Boolean(activeModalId);
            const switchingModal = hadActiveModal && activeModalId !== modalId;
            const activeModal = hadActiveModal ? document.getElementById(activeModalId) : null;
            const triggerInsideActiveModal = Boolean(activeModal && triggerEl instanceof Element && activeModal.contains(triggerEl));
            if (switchingModal) {
                const previousModal = activeModal;
                if (previousModal) {
                    previousModal.classList.add('hidden');
                    previousModal.setAttribute('aria-hidden', 'true');
                }
            }
            document.querySelectorAll('.modal-overlay').forEach((modalEl) => {
                if (modalEl.id !== modalId) {
                    modalEl.classList.add('hidden');
                    modalEl.setAttribute('aria-hidden', 'true');
                }
            });
            currentPlanType = planName;
            if (!triggerInsideActiveModal) {
                lastFocusedTrigger = triggerEl;
            }
            const titleEl = document.getElementById('signupModalTitle');
            const submitBtn = document.getElementById('signupSubmitBtn');
            if(titleEl) {
                if(planName === 'PRO') {
                    titleEl.textContent = 'Inscríbete al Plan Boost Pro';
                    if(submitBtn) {
                        submitBtn.textContent = 'Obtener Pro';
                        submitBtn.className = 'w-full py-4 bg-gradient-to-r from-slate-200 via-slate-100 to-slate-300 text-slate-900 font-extrabold rounded-2xl shadow-xl shadow-slate-300/30 hover:opacity-95 transition text-center';
                    }
                } else if(planName === 'VIP') {
                    titleEl.textContent = 'Inscríbete al Plan VIP / Teams';
                    if(submitBtn) {
                        submitBtn.textContent = 'Iniciar VIP';
                        submitBtn.className = 'w-full py-4 bg-gradient-to-r from-amber-300 via-yellow-500 to-amber-600 text-slate-900 font-extrabold rounded-2xl shadow-xl shadow-amber-500/40 hover:opacity-95 transition text-center';
                    }
                } else {
                    titleEl.textContent = 'Completa tus datos para enviarlos directamente';
                    if(submitBtn) {
                        submitBtn.textContent = 'Comenzar prueba gratis';
                        submitBtn.className = 'w-full py-4 bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold rounded-2xl shadow-xl shadow-purple-500/30 hover:opacity-95 transition text-center';
                    }
                }
            }
            const modal = requestedModal;
            if (!modal) {
                return;
            }
            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden', 'false');
            activeModalId = modalId;
            document.body.classList.add('overflow-hidden');
            const focusTarget = modal.querySelector('.modal-panel') || modal;
            focusTarget.focus();
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) {
                return;
            }
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
            if (modalId === activeModalId) {
                activeModalId = null;
                document.body.classList.remove('overflow-hidden');
                if (lastFocusedTrigger && typeof lastFocusedTrigger.focus === 'function') {
                    lastFocusedTrigger.focus();
                }
                lastFocusedTrigger = null;
            }
        }

        // Toast Message Notification
        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3500);
        }

        // WhatsApp Form Submit: Prueba Gratuita / Pro / VIP
        function handleWhatsAppSignup(event) {
            event.preventDefault();
            const name = document.getElementById('waName').value;
            const age = document.getElementById('waAge').value;
            const level = document.getElementById('waLevel').value;
            const country = document.getElementById('waCountry').value;

            let message = '';
            if(currentPlanType === 'PRO') {
                message = `Hola! Quiero comenzar clases en la versión PRO.\n\n*Plan seleccionado:* ${currentPlanType}\n\n*Mis datos:*\n- *Nombre completo:* ${name}\n- *Edad:* ${age}\n- *Nivel de inglés:* ${level}\n- *País:* ${country}`;
            } else if(currentPlanType === 'VIP') {
                message = `Hola! Quiero iniciar en el Plan VIP / Teams.\n\n*Plan seleccionado:* ${currentPlanType}\n\n*Mis datos:*\n- *Nombre completo:* ${name}\n- *Edad:* ${age}\n- *Nivel de inglés:* ${level}\n- *País:* ${country}`;
            } else {
                message = `Hola! Quiero registrarme a Hi5profe.\n\n*Plan seleccionado:* ${currentPlanType}\n\n*Mis datos:*\n- *Nombre completo:* ${name}\n- *Edad:* ${age}\n- *Nivel de inglés:* ${level}\n- *País:* ${country}`;
            }

            const encodedMessage = encodeURIComponent(message);
            openWhatsAppWindow(encodedMessage, '¡Redirigiendo a WhatsApp con tus datos!', 'signupModal');
        }

        // WhatsApp Form Submit: Clases en Vivo
        function handleLiveClassWhatsApp(event) {
            event.preventDefault();
            const name = document.getElementById('liveName').value;
            const level = document.getElementById('liveLevel').value;

            const message = `Hola, quiero unirme a los streams clases en vivo.\n\n*Mis datos:*\n- *Nombre completo:* ${name}\n- *Nivel de inglés:* ${level}`;
            const encodedMessage = encodeURIComponent(message);

            openWhatsAppWindow(encodedMessage, '¡Redirigiendo a WhatsApp para las clases en vivo!', 'liveClassModal');
        }

        // WhatsApp Form Submit: Horarios Flexibles
        function handleFlexibleScheduleWhatsApp(event) {
            event.preventDefault();
            const name = document.getElementById('schedName').value;
            const country = document.getElementById('schedCountry').value;
            const shift = document.getElementById('schedShift').value;
            const frequency = document.getElementById('schedFrequency').value;

            const message = `Hola! Me interesa configurar mis Horarios Flexibles en Hi5profe.\n\n*Mis datos:*\n- *Nombre completo:* ${name}\n- *País:* ${country}\n- *Turno preferido:* ${shift}\n- *Frecuencia:* ${frequency}`;
            const encodedMessage = encodeURIComponent(message);

            openWhatsAppWindow(encodedMessage, '¡Redirigiendo a WhatsApp con tus datos de horario!', 'flexibleScheduleModal');
        }
    </script>
</head>
<body class="bg-[#fafbfc] text-[#1e293b]">

    <div id="toastNotification" class="fixed bottom-6 right-24 z-50 transform translate-y-32 opacity-0 transition-all duration-500 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center space-x-3">
        <i class="fa-solid fa-circle-check text-purple-400 text-xl"></i>
        <span id="toastMessage" class="text-sm font-medium">Notificación</span>
    </div>

    <!-- Floating WhatsApp Button (Bottom Right) -->
    <a id="floatingWhatsappBtn" href="https://wa.me/51936932398?text=Hola,%20quiero%20más%20información%20sobre%20Hi5profe" target="_blank" rel="noopener noreferrer" aria-label="Abrir WhatsApp para más información" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-2xl phosphor-breathe">
        <i class="fa-brands fa-whatsapp text-2xl" aria-hidden="true"></i>
    </a>

    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#inicio" class="flex items-center space-x-3 group cursor-pointer">
                <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl overflow-hidden bg-white ring-1 ring-slate-200/80 shadow-md shadow-slate-200/70 flex-shrink-0 p-1">
                    <img src="favilogo.png" alt="Logo de Hi5profe" width="44" height="44" class="logo-crisp block w-full h-full object-contain">
                </div>
                <span class="text-2xl font-black text-slate-900 tracking-tight transition-colors duration-300 group-hover:text-purple-600">Hi5profe</span>
            </a>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center space-x-8 font-medium text-slate-600">
                <a href="#inicio" class="text-purple-600 font-semibold transition hover:text-purple-700">Inicio</a>
                <a href="#cursos" class="transition hover:text-purple-600">Cursos</a>
                <a href="#recursos" class="transition hover:text-purple-600">Recursos</a>
                <a href="#precios" class="transition hover:text-purple-600">Precios</a>
                <a href="#contacto" class="transition hover:text-purple-600">Contacto</a>
            </nav>

            <!-- Desktop CTA -->
            <div class="hidden md:flex items-center space-x-4">
                <button onclick="openModal('signupModal', 'Prueba Gratuita')" class="bg-gradient-to-r from-purple-600 to-pink-500 text-white text-sm font-semibold px-6 py-3 rounded-full shadow-lg shadow-purple-500/30 hover:opacity-90 transition">Empieza gratis</button>
            </div>

            <!-- Mobile Menu Button -->
            <button id="mobileMenuButton" onclick="toggleMobileMenu()" aria-label="Abrir o cerrar menú móvil" aria-controls="mobileMenu" aria-expanded="false" class="md:hidden text-slate-700 p-2 focus:outline-none">
                <i id="menuIcon" class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobileMenu" class="hidden md:hidden bg-white border-b border-slate-100 px-6 py-5 space-y-4 shadow-xl">
            <a href="#inicio" onclick="closeMobileMenu()" class="block font-medium text-purple-600">Inicio</a>
            <a href="#cursos" onclick="closeMobileMenu()" class="block font-medium text-slate-700">Cursos</a>
            <a href="#recursos" onclick="closeMobileMenu()" class="block font-medium text-slate-700">Recursos</a>
            <a href="#precios" onclick="closeMobileMenu()" class="block font-medium text-slate-700">Precios</a>
            <a href="#contacto" onclick="closeMobileMenu()" class="block font-medium text-slate-700">Contacto</a>
            <div class="pt-4 border-t border-slate-100 flex flex-col space-y-3">
                <button onclick="openModal('signupModal', 'Prueba Gratuita')" class="w-full text-center py-2.5 font-semibold text-white bg-gradient-to-r from-purple-600 to-pink-500 rounded-full shadow">Empieza gratis</button>
            </div>
        </div>
    </header>

    <!-- (contenido restante sin cambios funcionales; solo se añadió la clase logo-crisp a las imágenes del logo) -->

    <footer id="contacto" class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 scroll-animate">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
            <div class="space-y-4">
                <a href="#inicio" class="flex items-center space-x-2 group cursor-pointer inline-block">
                    <div class="w-8 h-8 rounded-lg overflow-hidden bg-white/95 ring-1 ring-white/10 shadow-md shadow-black/20 flex-shrink-0 p-1">
                        <img src="favilogo.png" alt="Logo de Hi5profe" width="32" height="32" class="logo-crisp block w-full h-full object-contain">
                    </div>
                    <span class="text-xl font-bold text-white">Hi5profe</span>
                </a>
                <p class="text-xs text-slate-400 leading-relaxed">Impulsando tu futuro profesional y personal a través del dominio total del inglés.</p>
            </div>
        </div>
    </footer>

</body>
</html>
